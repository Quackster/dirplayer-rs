plugins {
    id 'java'
    id 'application'
}

group = 'com.dirplayer'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // JSON processing for JS interop
    implementation 'com.google.code.gson:gson:2.10.1'

    // Image processing
    implementation 'org.imgscalr:imgscalr-lib:4.2'

    // XML processing
    implementation 'org.jdom:jdom2:2.0.6.1'

    // Compression (DEFLATE/zlib)
    implementation 'org.apache.commons:commons-compress:1.26.0'

    // Date/time (chrono equivalent)
    implementation 'joda-time:joda-time:2.12.5'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // Async/concurrent utilities
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'

    // TeaVM for JavaScript/browser compilation
    implementation 'org.teavm:teavm-classlib:0.9.2'
    implementation 'org.teavm:teavm-jso:0.9.2'
    implementation 'org.teavm:teavm-jso-apis:0.9.2'
}

application {
    mainClass = 'com.dirplayer.DirPlayer'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
