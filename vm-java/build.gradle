plugins {
    id 'java'
    id 'application'
    id 'org.teavm' version '0.10.2'
}

group = 'com.dirplayer'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // JSON processing for JS interop
    implementation 'com.google.code.gson:gson:2.10.1'

    // Compression (DEFLATE/zlib)
    implementation 'org.apache.commons:commons-compress:1.26.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'

    // TeaVM for WebAssembly/JavaScript compilation
    implementation 'org.teavm:teavm-classlib:0.10.2'
    implementation 'org.teavm:teavm-jso:0.10.2'
    implementation 'org.teavm:teavm-jso-apis:0.10.2'
    implementation 'org.teavm:teavm-interop:0.10.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
}

application {
    mainClass = 'com.dirplayer.DirPlayer'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Fat jar task for running the Swing player
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
    manifest {
        attributes 'Main-Class': 'com.dirplayer.swing.SwingPlayer'
    }
}

// Task to run the Swing player
tasks.register('runSwing', JavaExec) {
    group = 'application'
    description = 'Runs the Swing-based desktop player'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.dirplayer.swing.SwingPlayer'
}

// TeaVM configuration for WebAssembly output
teavm {
    js {
        mainClass = 'com.dirplayer.JsApi'
        targetFileName = 'dirplayer.js'
        obfuscated = false
        sourceMap = true
    }
    wasm {
        mainClass = 'com.dirplayer.JsApi'
        targetFileName = 'dirplayer.wasm'
        minHeapSize = 4
        maxHeapSize = 128
    }
}
