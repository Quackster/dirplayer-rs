plugins {
    id 'java'
    id 'application'
}

group = 'com.dirplayer'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // JSON processing for JS interop
    implementation 'com.google.code.gson:gson:2.10.1'

    // Compression (DEFLATE/zlib)
    implementation 'org.apache.commons:commons-compress:1.26.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'

    // TeaVM for WebAssembly/JavaScript compilation
    implementation 'org.teavm:teavm-classlib:0.10.2'
    implementation 'org.teavm:teavm-jso:0.10.2'
    implementation 'org.teavm:teavm-jso-apis:0.10.2'
    implementation 'org.teavm:teavm-interop:0.10.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
}

application {
    mainClass = 'com.dirplayer.DirPlayer'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
